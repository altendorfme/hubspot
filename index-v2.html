<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>HubSpot Form</title>

    <style>
        html,
        body {
            margin: 0;
            padding: 0;
            min-height: 100%;
        }

        body {
            font-family: Arial, sans-serif;
        }

        .hs-form-frame {
            margin: -40px !important;
        }
    </style>
</head>

<body>

    <div id="root"></div>

    <!-- React -->
    <script
        crossorigin
        src="https://unpkg.com/react@18/umd/react.development.js">
    </script>

    <script
        crossorigin
        src="https://unpkg.com/react-dom@18/umd/react-dom.development.js">
    </script>

    <!-- Babel -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <script type="text/babel">

        const { useEffect, useRef } = React;

        /**
         * Carrega o script da API v2 do HubSpot uma única vez.
         */
        function loadHubSpotScript() {
            return new Promise((resolve, reject) => {

                // Se o HubSpot já estiver disponível
                if (window.hbspt?.forms) {
                    resolve(window.hbspt);
                    return;
                }

                // Verifica se o script já existe
                const existingScript = document.querySelector(
                    'script[src="https://js.hsforms.net/forms/embed/v2.js"]'
                );

                if (existingScript) {

                    existingScript.addEventListener("load", () => {
                        resolve(window.hbspt);
                    });

                    existingScript.addEventListener("error", reject);

                    return;
                }

                // Cria o script da API v2
                const script = document.createElement("script");

                script.charset = "utf-8";
                script.type = "text/javascript";
                script.src = "https://js.hsforms.net/forms/embed/v2.js";

                script.onload = () => {
                    resolve(window.hbspt);
                };

                script.onerror = reject;

                document.body.appendChild(script);
            });
        }


        /**
         * HubSpotForm
         *
         * Props:
         * - formId
         * - portalId
         * - region
         */
        function HubSpotForm({
            formId,
            portalId = "6514799",
            region = "na1"
        }) {

            const containerRef = useRef(null);

            useEffect(() => {

                let mounted = true;

                async function initializeForm() {

                    try {

                        const hbspt = await loadHubSpotScript();

                        if (!mounted || !containerRef.current) {
                            return;
                        }

                        // Limpa o container antes de criar o formulário
                        containerRef.current.innerHTML = "";

                        hbspt.forms.create({

                            portalId: portalId,

                            formId: formId,

                            region: region,

                            target: containerRef.current

                        });

                    } catch (error) {

                        console.error(
                            "Erro ao carregar o formulário HubSpot:",
                            error
                        );

                    }
                }

                initializeForm();

                return () => {
                    mounted = false;
                };

            }, [formId, portalId, region]);


            return (
                <div
                    ref={containerRef}
                    className="hs-form-frame"
                    style={{
                        minHeight: "400px"
                    }}
                />
            );
        }


        /*
         * ==========================================
         * CONFIGURAÇÃO
         * ==========================================
         */

        const hubspotForm = {

            formId:
                "027454ef-1313-45c8-a7d5-2fc46e9ac969",

            portalId:
                "6514799",

            region:
                "na1"
        };


        /*
         * ==========================================
         * RENDER
         * ==========================================
         */

        const root = ReactDOM.createRoot(
            document.getElementById("root")
        );

        root.render(
            <HubSpotForm
                formId={hubspotForm.formId}
                portalId={hubspotForm.portalId}
                region={hubspotForm.region}
            />
        );

    </script>

</body>
</html>
